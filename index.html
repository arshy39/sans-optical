<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت اتاق فرار اپتیکال</title>
  <style>
    body {
      background-color: #121212; color: #fff; font-family: Tahoma, sans-serif;
      margin: 0; padding: 20px; display: flex; justify-content: center;
    }
    .container {
      background: #1e1e1e; padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px;
      border-top: 4px solid #ff3b3b;
    }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #333; }
    .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #888; font-weight: bold; }
    .tab.active { color: #ff3b3b; border-bottom: 2px solid #ff3b3b; }
    .section { display: none; }
    .section.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
    select, input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333;
      background: #2b2b2b; color: #fff; font-size: 16px; box-sizing: border-box;
    }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    button {
      width: 100%; padding: 12px; background: #ff3b3b; color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 10px; transition: 0.3s;
    }
    #message, #reportMessage { text-align: center; margin-top: 15px; font-size: 14px; }
    .success { color: #4caf50; } .error { color: #f44336; }
    
    /* استایل‌های کارت گزارش */
    .report-card { background: #2b2b2b; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-right: 4px solid #ff3b3b; }
    .report-card.summary { border-right-color: #4caf50; background: #1a2a1a; }
    .report-title { font-weight: bold; color: #fff; margin-bottom: 8px; font-size: 15px; }
    .report-detail { font-size: 13px; color: #bbb; margin-bottom: 4px; }
    .highlight { color: #ffeb3b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('add')">ثبت رزرو</div>
      <div class="tab" onclick="switchTab('report')">گزارش‌گیری</div>
    </div>

    <!-- بخش ثبت اطلاعات -->
    <div id="addSection" class="section active">
      <form id="reservationForm">
        <div class="row">
          <div class="form-group">
            <label>ماه</label>
            <select name="month" required>
              <option value="شهریور">شهریور</option><option value="مهر">مهر</option>
              <option value="آبان">آبان</option><option value="آذر">آذر</option>
            </select>
          </div>
          <div class="form-group">
            <label>روز (۱ تا ۳۱)</label>
            <input type="number" name="day" min="1" max="31" required>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>سانس</label>
            <select name="session" required>
              <option value="10:00">10:00</option><option value="12:00">12:00</option>
              <option value="14:00">14:00</option><option value="16:15">16:15</option>
              <option value="18:30">18:30</option><option value="20:45">20:45</option>
              <option value="23:00">23:00</option><option value="01:15">01:15</option>
            </select>
          </div>
          <div class="form-group">
            <label>پلتفرم</label>
            <select name="platform" required>
              <option value="we">WE (بدون کمیسیون)</option>
              <option value="t4f">T4F (۱۴٪)</option><option value="zoom">Zoom (۱۱٪)</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>رزرو شده</label><input type="number" name="reserved" value="0" min="0" required>
          </div>
          <div class="form-group">
            <label>حاضر شده</label><input type="number" name="attended" value="0" min="0" required>
          </div>
        </div>
        <div class="form-group">
          <label>بیعانه (تومان)</label><input type="number" name="deposit" value="0" required>
        </div>
        <div class="form-group">
          <label>تیم / توضیحات</label><input type="text" name="team">
        </div>
        <button type="submit" id="submitBtn">ثبت در گوگل شیت</button>
        <div id="message"></div>
      </form>
    </div>

    <!-- بخش گزارش گیری -->
    <div id="reportSection" class="section">
      <div class="form-group">
        <label>انتخاب ماه برای گزارش:</label>
        <select id="reportMonthSelect">
          <option value="شهریور">شهریور</option><option value="مهر">مهر</option>
          <option value="آبان">آبان</option><option value="آذر">آذر</option>
        </select>
      </div>
      <button id="getReportBtn" onclick="fetchReport()">دریافت لیست رزروها</button>
      <div id="reportMessage"></div>
      <div id="reportList" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIp3FzWyGZH7Fos2c2P0b9UiAmIsGPlneZ8bekAilV5jhT8P3w4CrTqLgExuesT8KAJQ/exec';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if(tab === 'add') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('addSection').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('reportSection').classList.add('active');
      }
    }

    // بخش ثبت اطلاعات (همان کد قبلی)
    document.getElementById('reservationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      btn.innerText = 'در حال ثبت...';
      const formData = new FormData(this);
      fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: new URLSearchParams(formData) })
      .then(response => response.text())
      .then(text => {
        btn.innerText = 'ثبت در گوگل شیت';
        if(text.includes('موفقیت')) {
          msg.className = 'success'; msg.innerText = '✅ ذخیره شد!'; this.reset();
        } else { msg.className = 'error'; msg.innerText = '❌ ' + text; }
      });
    });

    // بخش گرفتن گزارش
    function fetchReport() {
      const btn = document.getElementById('getReportBtn');
      const msg = document.getElementById('reportMessage');
      const list = document.getElementById('reportList');
      const month = document.getElementById('reportMonthSelect').value;
      
      btn.innerText = 'در حال دریافت اطلاعات...';
      msg.innerText = ''; list.innerHTML = '';

      fetch(GOOGLE_SCRIPT_URL + '?month=' + month)
      .then(res => res.json())
      .then(result => {
        btn.innerText = 'دریافت لیست رزروها';
        if (result.error) { msg.className = 'error'; msg.innerText = result.error; return; }
        if (result.data.length === 0) { msg.className = ''; msg.innerText = 'هیچ سانس پر شده‌ای یافت نشد.'; return; }
        
        result.data.forEach(item => {
          let card = document.createElement('div');
          if (item.type === 'summary') {
            card.className = 'report-card summary';
            card.innerHTML = `<div class="report-title">📊 ${item.date}</div>
                              <div class="report-detail">درآمد خالص کل: <span class="highlight">${item.net} تومان</span></div>`;
          } else {
            card.className = 'report-card';
            card.innerHTML = `<div class="report-title">🗓 ${item.date} - ساعت ${item.session}</div>
                              <div class="report-detail">تیم: ${item.team || 'نامشخص'} | پلتفرم: ${item.platform}</div>
                              <div class="report-detail">حاضرین: ${item.attended} نفر | درآمد خالص: <span class="highlight">${item.net}</span></div>`;
          }
          list.appendChild(card);
        });
      })
      .catch(err => {
        btn.innerText = 'دریافت لیست رزروها';
        msg.className = 'error'; msg.innerText = 'خطا در برقراری ارتباط با شیت!';
      });
    }
  </script>
</body>
</html>
