<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت اتاق فرار اپتیکال</title>
  <style>
    body {
      background-color: #121212; color: #fff; font-family: Tahoma, sans-serif;
      margin: 0; padding: 20px; display: flex; justify-content: center;
    }
    .container {
      background: #1e1e1e; padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px;
      border-top: 4px solid #ff3b3b;
    }
    h2 { text-align: center; margin-bottom: 25px; color: #ff3b3b; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
    select, input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333;
      background: #2b2b2b; color: #fff; font-size: 16px; box-sizing: border-box;
    }
    select:focus, input:focus { outline: none; border-color: #ff3b3b; }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    button {
      width: 100%; padding: 12px; background: #ff3b3b; color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 10px; transition: 0.3s;
    }
    button:hover { background: #d63232; }
    #message { text-align: center; margin-top: 15px; font-size: 14px; }
    .success { color: #4caf50; }
    .error { color: #f44336; }
  </style>
</head>
<body>

  <div class="container">
    <h2>مدیریت رزرو اپتیکال</h2>
    <form id="reservationForm">
      
      <div class="row">
        <div class="form-group">
          <label>ماه</label>
          <select name="month" required>
            <option value="فروردین">فروردین</option>
            <option value="اردیبهشت">اردیبهشت</option>
            <option value="خرداد">خرداد</option>
            <option value="تیر">تیر</option>
            <option value="مرداد">مرداد</option>
            <option value="شهریور">شهریور</option>
            <option value="مهر">مهر</option>
            <option value="آبان">آبان</option>
            <option value="آذر">آذر</option>
            <option value="دی">دی</option>
            <option value="بهمن">بهمن</option>
            <option value="اسفند">اسفند</option>
          </select>
        </div>
        <div class="form-group">
          <label>روز (۱ تا ۳۱)</label>
          <input type="number" name="day" min="1" max="31" required>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>سانس</label>
          <select name="session" required>
            <option value="10:00">10:00</option>
            <option value="12:00">12:00</option>
            <option value="14:00">14:00</option>
            <option value="16:15">16:15</option>
            <option value="18:30">18:30</option>
            <option value="20:45">20:45</option>
            <option value="23:00">23:00</option>
            <option value="01:15">01:15</option>
          </select>
        </div>
        <div class="form-group">
          <label>پلتفرم</label>
          <select name="platform" required>
            <option value="we">WE (بدون کمیسیون)</option>
            <option value="t4f">T4F (۱۴٪)</option>
            <option value="zoom">Zoom (۱۱٪)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>رزرو شده (نفر)</label>
          <input type="number" name="reserved" value="0" min="0" required>
        </div>
        <div class="form-group">
          <label>حاضر شده (نفر)</label>
          <input type="number" name="attended" value="0" min="0" required>
        </div>
      </div>

      <div class="form-group">
        <label>بیعانه دریافتی (تومان)</label>
        <input type="number" name="deposit" value="0" required>
      </div>

      <div class="form-group">
        <label>نام تیم و توضیحات</label>
        <input type="text" name="team" placeholder="مثلاً: تیم شجاعان + بدون تاخیر">
      </div>

      <button type="submit" id="submitBtn">ثبت در گوگل شیت</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    // لینک گوگل اسکریپت شما:
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIp3FzWyGZH7Fos2c2P0b9UiAmIsGPlneZ8bekAilV5jhT8P3w4CrTqLgExuesT8KAJQ/exec';

    document.getElementById('reservationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      
      btn.innerText = 'در حال ثبت...';
      btn.style.background = '#555';
      msg.innerText = '';

      const formData = new FormData(this);
      const data = new URLSearchParams(formData);

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: data
      })
      .then(response => response.text())
      .then(text => {
        btn.innerText = 'ثبت در گوگل شیت';
        btn.style.background = '#ff3b3b';
        
        if(text.includes('موفقیت')) {
          msg.className = 'success';
          msg.innerText = '✅ اطلاعات با موفقیت در شیت ذخیره شد!';
          this.reset();
        } else {
          msg.className = 'error';
          msg.innerText = '❌ ' + text;
        }
      })
      .catch(error => {
        btn.innerText = 'ثبت در گوگل شیت';
        btn.style.background = '#ff3b3b';
        msg.className = 'error';
        msg.innerText = '❌ خطای شبکه! لطفا دوباره تلاش کنید.';
      });
    });
  </script>
</body>
</html>
